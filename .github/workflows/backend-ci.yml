name: Backend CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Debug - listar estrutura do repo
        run: |
          pwd
          ls -la
          echo "----"
          find . -maxdepth 3 -type f -name "pom.xml" -print

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Localizar pom.xml
        id: pom
        shell: bash
        run: |
          POM="$(find . -maxdepth 5 -name pom.xml -print | head -n 1)"
          if [ -z "$POM" ]; then
            echo "Nenhum pom.xml encontrado!"
            exit 1
          fi
          echo "Encontrado: $POM"
          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$POM")" >> "$GITHUB_OUTPUT"

      - name: Instalar Dependências
        run: mvn dependency:resolve
        working-directory: ${{ steps.pom.outputs.dir }}

      - name: Executar Testes com Cobertura
        run: mvn clean verify -DskipITs
        working-directory: ${{ steps.pom.outputs.dir }}

      - name: Criar pasta de badges
        run: mkdir -p .github/badges

      - name: Gerar selo (badge) do JaCoCo
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: ${{ steps.pom.outputs.dir }}/target/site/jacoco/jacoco.csv
          generate-branches-badge: true
          badges-directory: .github/badges

      - name: Fazer commit do selo (se houver mudança)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add .github/badges/jacoco.svg .github/badges/branches.svg || echo "Badges not found, skipping add"
          git commit -m "Autogenerated JaCoCo coverage badge" || echo "Nothing to commit"
          git push || echo "Nothing to push"


